<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline Admin</title><meta name="robots" content="noindex,nofollow"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px system-ui;background:radial-gradient(circle at 20% 10%,#17213c,#070b14 48%);color:#f4f7ff;padding:24px}.wrap{width:min(1050px,100%);margin:auto}.panel,.card{border:1px solid #ffffff20;border-radius:20px;background:#0d1424dd;box-shadow:0 25px 80px #0007}.panel{padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.badge{color:#b9ff79}h1{font-size:clamp(2rem,6vw,4rem);margin:.25em 0}.muted{color:#9faac1}.login{max-width:460px;margin:8vh auto}.login input{width:100%;padding:14px;margin:7px 0;border:1px solid #ffffff28;border-radius:12px;background:#080d17;color:white}.btn{border:0;border-radius:12px;padding:13px 18px;background:#b9ff79;color:#07100a;font-weight:800;cursor:pointer}.ghost{background:#ffffff10;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{padding:18px}.card b{font-size:1.8rem;display:block;margin-top:5px}.rows{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rows table{width:100%;border-collapse:collapse}.rows td,.rows th{padding:10px;border-bottom:1px solid #ffffff12;text-align:left}.error{color:#ff9b9b}.hidden{display:none!important}@media(max-width:700px){body{padding:12px}.grid,.rows{grid-template-columns:1fr}.panel{padding:18px}}
</style></head><body><div class="wrap">
<section id="login" class="panel login"><span class="badge">SKYLINE / ADMIN</span><h1>Sign in</h1><p class="muted">Use your authorised Skyline admin account.</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="Email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="btn" type="submit">SIGN IN</button></form><p id="loginError" class="error"></p></section>
<section id="dash" class="hidden"><div class="panel top"><div><span class="badge">SKYLINE / ADMIN</span><h1>Analytics</h1><span id="who" class="muted"></span></div><button id="logout" class="btn ghost">SIGN OUT</button></div>
<div class="grid"><div class="card"><span class="muted">Page views today</span><b id="today">0</b></div><div class="card"><span class="muted">Page views / 30 days</span><b id="views30">0</b></div><div class="card"><span class="muted">Sessions / 7 days</span><b id="sessions7">0</b></div><div class="card"><span class="muted">WhatsApp clicks / 30 days</span><b id="wa30">0</b></div><div class="card"><span class="muted">Leads / 30 days</span><b id="leads30">0</b></div><div class="card"><span class="muted">Page views / 7 days</span><b id="views7">0</b></div></div>
<div class="rows"><div class="card"><h2>Last 30 days</h2><table><thead><tr><th>Day</th><th>Views</th><th>Sessions</th></tr></thead><tbody id="traffic"></tbody></table></div><div class="card"><h2>Clicks & events</h2><table><thead><tr><th>Event</th><th>Total</th></tr></thead><tbody id="events"></tbody></table></div></div><p id="dashError" class="error"></p></section>
</div><script src="../assets/supabase-config.js"></script><script>
const C=window.SKYLINE_SUPABASE, base=C.url+"/auth/v1", rpc=C.url+"/rest/v1/rpc/";
const H=t=>({apikey:C.key,Authorization:"Bearer "+t,"Content-Type":"application/json"});
const store=(d)=>localStorage.setItem("skyline_admin_session",JSON.stringify(d));
const get=()=>{try{return JSON.parse(localStorage.getItem("skyline_admin_session"))}catch{return null}};
const clear=()=>localStorage.removeItem("skyline_admin_session");
async function call(name,token,body={}){const r=await fetch(rpc+name,{method:"POST",headers:H(token),body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
async function show(s){try{const a=await call("is_admin",s.access_token);if(a!==true)throw new Error("This account is not authorised for Skyline admin.");login.classList.add("hidden");dash.classList.remove("hidden");who.textContent=s.user?.email||"";const [st,tr,ev]=await Promise.all([call("admin_get_stats",s.access_token),call("admin_daily_traffic",s.access_token,{p_days:30}),call("admin_event_breakdown",s.access_token,{p_days:30})]);today.textContent=st.page_views_today||0;views30.textContent=st.page_views_30d||0;sessions7.textContent=st.sessions_7d||0;wa30.textContent=st.whatsapp_clicks_30d||0;leads30.textContent=st.leads_30d||0;views7.textContent=st.page_views_7d||0;traffic.innerHTML=tr.map(x=>'<tr><td>'+x.day+'</td><td>'+x.page_views+'</td><td>'+x.sessions+'</td></tr>').join("")||'<tr><td colspan="3">No traffic yet</td></tr>';events.innerHTML=ev.map(x=>'<tr><td>'+x.event_name.replaceAll("_"," ")+'</td><td>'+x.total+'</td></tr>').join("")||'<tr><td colspan="2">No events yet</td></tr>'}catch(e){clear();dash.classList.add("hidden");login.classList.remove("hidden");loginError.textContent=e.message}}
loginForm.addEventListener("submit",async e=>{e.preventDefault();loginError.textContent="";try{const r=await fetch(base+"/token?grant_type=password",{method:"POST",headers:{"apikey":C.key,"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||"Sign in failed");store(d);await show(d)}catch(x){loginError.textContent=x.message}});
logout.onclick=async()=>{const s=get();if(s)fetch(base+"/logout",{method:"POST",headers:H(s.access_token)}).catch(()=>{});clear();location.reload()};
const s=get();if(s)show(s);
</script></body></html>
